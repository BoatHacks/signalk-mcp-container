name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-smoke-test:
    # Builds the actual container image and exercises the execute_code tool
    # end to end — npm run build only typechecks the plugin, it never
    # catches a runtime break in the image itself (this is the job that
    # would have caught the isolated-vm/musl SIGSEGV before it shipped).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t signalk-mcp-server-container:ci -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d --name mcp-smoke -p 8000:8000 \
            -e SIGNALK_HOST=127.0.0.1 -e SIGNALK_PORT=1 -e SIGNALK_TLS=false \
            signalk-mcp-server-container:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::health endpoint never came up"
          docker logs mcp-smoke
          exit 1

      - name: Initialize MCP session
        run: |
          curl -sf -D headers.txt -o /dev/null \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke-test","version":"1.0.0"}}}' \
            http://127.0.0.1:8000/mcp
          SESSION_ID=$(grep -i '^mcp-session-id:' headers.txt | awk '{print $2}' | tr -d '\r')
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          curl -sf -o /dev/null \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H "mcp-session-id: $SESSION_ID" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            http://127.0.0.1:8000/mcp

      - name: Call execute_code (this is what crashed under Alpine/musl)
        run: |
          RESPONSE=$(curl -sf \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H "mcp-session-id: $SESSION_ID" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute_code","arguments":{"code":"(async () => { return JSON.stringify({ ok: true }); })()"}}}' \
            http://127.0.0.1:8000/mcp)
          echo "$RESPONSE"
          # The tool's own output is JSON embedded (and escaped) inside the
          # JSON-RPC envelope's "text" field, so match on the outer keys —
          # not the doubly-escaped inner content, which is fragile to match
          # literally. curl -sf alone already fails loudly on a dropped
          # connection (the segfault case); this just confirms a well-formed
          # result came back rather than a JSON-RPC error.
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::execute_code returned a JSON-RPC error"
            docker logs mcp-smoke
            exit 1
          fi
          echo "$RESPONSE" | grep -q '"result"' || {
            echo "::error::execute_code did not return a result — process likely crashed"
            docker logs mcp-smoke
            exit 1
          }

      - name: Container still alive (didn't segfault)
        run: docker inspect -f '{{.State.Running}}' mcp-smoke | grep -q true

      - name: Start stub SignalK server (401 unless Authorization matches)
        run: |
          python3 .github/scripts/ci-stub-signalk.py &
          echo $! > /tmp/stub-signalk.pid

      - name: healthcheck.sh fails without a token (401 from stub SignalK)
        run: |
          # --network host to reach the stub server at 127.0.0.1:3001; a
          # non-default PORT avoids clashing with mcp-smoke, still up on
          # host port 8000 via its own -p mapping.
          docker run -d --name mcp-no-token --network host \
            -e PORT=8001 \
            -e SIGNALK_HOST=127.0.0.1 -e SIGNALK_PORT=3001 -e SIGNALK_TLS=false \
            signalk-mcp-server-container:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/healthz >/dev/null && break
            sleep 1
          done
          if docker exec mcp-no-token /healthcheck.sh; then
            echo "::error::healthcheck.sh passed with no token against a SignalK that requires one"
            docker logs mcp-no-token
            exit 1
          fi
          docker rm -f mcp-no-token >/dev/null

      - name: healthcheck.sh passes with the correct token
        run: |
          docker run -d --name mcp-good-token --network host \
            -e PORT=8002 \
            -e SIGNALK_HOST=127.0.0.1 -e SIGNALK_PORT=3001 -e SIGNALK_TLS=false \
            -e SIGNALK_TOKEN=good-token \
            signalk-mcp-server-container:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8002/healthz >/dev/null && break
            sleep 1
          done
          docker exec mcp-good-token /healthcheck.sh || {
            echo "::error::healthcheck.sh failed with a valid token"
            docker logs mcp-good-token
            exit 1
          }
          docker rm -f mcp-good-token >/dev/null

      - name: Stop stub SignalK server
        if: always()
        run: kill "$(cat /tmp/stub-signalk.pid)" 2>/dev/null || true

      - name: Dump logs
        if: always()
        run: docker logs mcp-smoke || true
